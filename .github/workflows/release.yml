name: Release Mac app
# A release is published whenever the version in package.json is one that has not been released yet.
# Push to main with a bumped version, or press "Run workflow" in the Actions tab.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Read version
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "seen=true" >> "$GITHUB_OUTPUT"; else echo "seen=false" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
        if: steps.seen.outputs.seen == 'false'
      - run: npm test
        if: steps.seen.outputs.seen == 'false'
      - name: Build app
        if: steps.seen.outputs.seen == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log || { echo "::error::$(tail -n 12 build.log | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
      - name: Build disk images (optional)
        if: steps.seen.outputs.seen == 'false'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:dmg
      - name: Publish release
        if: steps.seen.outputs.seen == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/tandem-mac-*.zip
            dist/tandem-mac-*.dmg

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151823">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="tandem">
  <title>tandem</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 20" width="32" height="20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="var(--claude)"/><circle cx="22" cy="10" r="8" fill="var(--codex)" fill-opacity=".9"/></svg>
        <span>tandem</span>
      </div>
      <button id="new-thread" class="primary">New thread</button>
      <nav id="thread-list" aria-label="Threads"></nav>
      <div class="side-foot">
        <button class="navbtn" data-view="memory">Memory</button>
        <button class="navbtn" data-view="settings">Settings</button>
      </div>
    </aside>
    <div id="scrim" hidden></div>

    <main id="main">
      <header id="topbar">
        <button id="menu" aria-label="Open menu">Menu</button>
        <h1 id="title">tandem</h1>
        <div id="top-actions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
